<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Evolución Fractal</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205; /* Espacio profundo */
            font-family: sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        }
        h1 { margin: 0 0 5px 0; font-size: 1.2rem; font-weight: normal; letter-spacing: 2px; }
        p { margin: 0; font-size: 0.9rem; color: #aaa; }
        #data { font-family: monospace; color: #00ffcc; margin-top: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <h1>XENOSYNTH: EVOLUCIÓN PROCEDURAL</h1>
        <p>Mueve el ratón para mirar alrededor.</p>
        <div id="data">Generación: 0<br>Entidades activas: 0</div>
    </div>
    
    <script>
        let scene, camera, renderer;
        let fractalesActivos = [];
        let generacionGlobal = 0;
        
        // Variables de control de flujo
        let VELOCIDAD_VIAJE = 0.8; // Velocidad a la que se mueve el usuario
        const DISTANCIA_VISION = 400; // Qué tan lejos vemos/generamos hacia adelante
        const DISTANCIA_MUERTE = 50;  // Distancia a la que desaparecen detrás de nosotros
        const INTERVALO_SPAWN = 40;   // Distancia entre fractales
        let proximoSpawnZ = 0;        // Marcador del próximo nacimiento en el eje Z

        // Interacción con ratón
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            // Niebla crucial para que los objetos no "aparezcan" de golpe, sino que emerjan de la oscuridad
            scene.fog = new THREE.FogExp2(0x020205, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 0, 0); // La cámara no se mueve, el universo viene hacia ella

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.AdditiveToneMapping;
            document.body.appendChild(renderer.domElement);

            // Iluminación dinámica
            const luzAmbiental = new THREE.AmbientLight(0x111122);
            scene.add(luzAmbiental);
            
            // Luz que simula el "núcleo" de la cámara
            const luzFrontal = new THREE.PointLight(0xffffff, 1.5, 100);
            luzFrontal.position.set(0, 0, 0);
            scene.add(luzFrontal);

            // El horizonte se llenará automáticamente en el primer frame del bucle animate()

            document.addEventListener('mousemove', onDocumentMouseMove, false);
            window.addEventListener('resize', onWindowResize, false);
        }

        function spawnFractal(zPos) {
            generacionGlobal++;
            
            // --- EVOLUCIÓN PROFUNDA MATEMÁTICA ---
            // La "fase" cambia lentamente, dictando grandes eras evolutivas
            const faseEvolutiva = generacionGlobal * 0.05; 
            
            // 1. Mutación Estructural (El ADN de la forma)
            const mutacionEstructural = Math.sin(faseEvolutiva); 
            const anguloAureo = Math.PI * (3 - Math.sqrt(5));
            const anguloEvolutivo = anguloAureo + (Math.cos(faseEvolutiva * 0.5) * 0.5);

            // 2. Complejidad: cantidad de piezas varía enormemente (de 50 a 450)
            const numElementos = Math.floor(250 + Math.sin(faseEvolutiva * 1.2) * 200);

            // 3. Paleta de colores evolutiva
            const hue = (generacionGlobal * 0.015) % 1.0;
            const wireframeProb = Math.random() > 0.85; // 15% de probabilidad de ser una anomalía alámbrica
            
            // 4. Tamaño general evoluciona
            const radioTotal = 12 + Math.sin(faseEvolutiva) * 8;

            const grupo = new THREE.Group();
            
            // Dispersión en X e Y (el túnel se ensancha o estrecha)
            const dispersion = 50 + Math.sin(faseEvolutiva * 0.8) * 30;
            const posX = (Math.random() - 0.5) * dispersion;
            const posY = (Math.random() - 0.5) * dispersion;
            grupo.position.set(posX, posY, zPos);

            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(hue, 0.8, 0.5),
                emissive: new THREE.Color().setHSL(hue, 1.0, 0.2),
                transparent: true,
                opacity: wireframeProb ? 0.3 : 0.8,
                roughness: 0.1,
                metalness: 0.9,
                wireframe: wireframeProb
            });

            // --- MUTACIÓN DE LA GEOMETRÍA BASE ---
            let geoBase;
            // Alternar entre 4 tipos de geometrías a medida que avanzamos en el universo
            const tipoGeometria = Math.floor(Math.abs(Math.sin(faseEvolutiva * 0.5) * 4)); 
            
            if(tipoGeometria === 0) geoBase = new THREE.OctahedronGeometry(0.5, 0);
            else if(tipoGeometria === 1) geoBase = new THREE.TetrahedronGeometry(0.5, 0);
            else if(tipoGeometria === 2) geoBase = new THREE.TorusGeometry(0.3, 0.1, 8, 16);
            else geoBase = new THREE.DodecahedronGeometry(0.4, 0);

            // Deformación de la "célula"
            geoBase.scale(
                0.2 + Math.abs(Math.sin(generacionGlobal))*0.8, 
                1.0 + Math.abs(Math.cos(generacionGlobal))*2.0, 
                0.2 + Math.abs(Math.sin(generacionGlobal))*0.8
            );

            // --- MUTACIÓN DE LA LEY DE CRECIMIENTO (ARQUITECTURA) ---
            // Cada 15 generaciones, el universo cambia su física de creación
            const tipoArquitectura = Math.floor((generacionGlobal / 15) % 3);

            for (let i = 0; i < numElementos; i++) {
                let x, y, z;
                const ratio = i / (numElementos - 1);
                const theta = anguloEvolutivo * i;

                if (tipoArquitectura === 0) {
                    // Arquitectura 0: Esfera / Ovoide Fibonacci
                    y = 1 - ratio * 2; 
                    const radioAtY = Math.sqrt(1 - y * y); 
                    x = Math.cos(theta) * radioAtY;
                    z = Math.sin(theta) * radioAtY;
                } else if (tipoArquitectura === 1) {
                    // Arquitectura 1: Tornado / Espiral de ADN
                    y = (ratio * 2) - 1; 
                    const expansion = ratio * 2; // Se ensancha hacia la copa
                    x = Math.cos(theta) * expansion;
                    z = Math.sin(theta) * expansion;
                } else {
                    // Arquitectura 2: Anillos concéntricos ondulados
                    y = Math.sin(theta * 2) * 0.3; // Plano con ondas
                    const radioPlano = ratio; 
                    x = Math.cos(theta) * radioPlano;
                    z = Math.sin(theta) * radioPlano;
                }

                const mesh = new THREE.Mesh(geoBase, material);
                mesh.position.set(x * radioTotal, y * radioTotal, z * radioTotal);
                
                // Rotación orgánica de las células
                if(tipoArquitectura === 0) mesh.lookAt(0,0,0);
                else mesh.rotation.set(Math.random(), Math.random(), Math.random());
                
                mesh.scale.multiplyScalar((1 - ratio) * 2.0 + 0.5);
                grupo.add(mesh);
            }

            grupo.userData = {
                idGen: generacionGlobal,
                rotacionX: (Math.random() - 0.5) * 0.01,
                rotacionY: (Math.random() - 0.5) * 0.02,
                rotacionZ: (Math.random() - 0.5) * 0.01,
                pulsoVelocidad: 0.5 + Math.random() * 2,
                pulsoFase: Math.random() * Math.PI * 2
            };

            scene.add(grupo);
            fractalesActivos.push(grupo);
            actualizarUI();
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2);
            mouseY = (event.clientY - window.innerHeight / 2);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function actualizarUI() {
            document.getElementById('data').innerHTML = 
                `Generación: ${generacionGlobal}<br>Entidades activas: ${fractalesActivos.length}`;
        }

        function animate() {
            requestAnimationFrame(animate);
            const tiempo = Date.now() * 0.001;

            // 1. EL USUARIO SE MUEVE HACIA ADELANTE (Adentrándose en el Eje -Z)
            camera.position.z -= VELOCIDAD_VIAJE;

            // Suavizado del movimiento lateral de la cámara basado en el ratón
            targetX = mouseX * 0.05;
            targetY = mouseY * 0.05;
            camera.position.x += (targetX - camera.position.x) * 0.02;
            camera.position.y += (-targetY - camera.position.y) * 0.02;
            
            // La cámara mira hacia el horizonte, inclinándose sutilmente
            camera.lookAt(camera.position.x, camera.position.y, camera.position.z - 100);

            // Actualizar la posición de la luz central para que viaje contigo (eres una nave luminosa)
            scene.children.forEach(child => {
                if(child.isPointLight) {
                    child.position.z = camera.position.z;
                    child.position.x = camera.position.x;
                    child.position.y = camera.position.y;
                }
            });

            // 2. GENERADOR INFINITO DINÁMICO (Crea terreno frente a ti)
            // Evaluamos si nos hemos acercado lo suficiente al límite para generar más formas
            while (proximoSpawnZ > camera.position.z - DISTANCIA_VISION) {
                spawnFractal(proximoSpawnZ);
                proximoSpawnZ -= INTERVALO_SPAWN; // Avanzamos hacia números negativos
            }

            // 3. EVOLUCIÓN INTRÍNSECA Y LIMPIEZA DE MEMORIA
            for (let i = fractalesActivos.length - 1; i >= 0; i--) {
                const fractal = fractalesActivos[i];
                
                // Rotación y respiración de cada estructura
                fractal.rotation.x += fractal.userData.rotacionX;
                fractal.rotation.y += fractal.userData.rotacionY;
                fractal.rotation.z += fractal.userData.rotacionZ;
                
                const escalaPulso = 1 + Math.sin(tiempo * fractal.userData.pulsoVelocidad + fractal.userData.pulsoFase) * 0.05;
                fractal.scale.set(escalaPulso, escalaPulso, escalaPulso);

                // Si el fractal queda muy por detrás de la cámara, lo destruimos y liberamos la memoria RAM/VRAM
                if (fractal.position.z > camera.position.z + DISTANCIA_MUERTE) {
                    scene.remove(fractal);
                    fractal.traverse((child) => {
                        if (child.isMesh) {
                            child.geometry.dispose();
                            child.material.dispose();
                        }
                    });
                    fractalesActivos.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
