<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenosynth - Experiencia Fractal Inmersiva</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010103; 
            font-family: sans-serif;
            touch-action: none; /* Previene scroll en móviles */
        }
        #ui-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            z-index: 100;
            text-align: center;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.8);
            transition: opacity 2s ease-in-out; /* Para el desvanecimiento */
        }
        h1 { margin: 0 0 10px 0; font-size: 2rem; font-weight: normal; letter-spacing: 4px; }
        p { margin: 0 0 8px 0; font-size: 1rem; color: #ddd; }
        .controls { color: #00ffcc; font-weight: bold; margin-top: 20px;}
        .highlight { font-size: 1.2rem; color: #fff; text-transform: uppercase; letter-spacing: 2px;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <h1>XENOSYNTH</h1>
        <p class="highlight">Haz clic o toca la pantalla para iniciar el enlace sinestésico</p>
        <p>Arrastra para dirigir. Mantén presionado para aumentar la densidad (frenar).</p>
        <p class="controls">[3] Modo VR/Estéreo &nbsp; | &nbsp; [9] y [0] Ajustar Foco</p>
    </div>
    
    <script>
        // --- 1. CONFIGURACIÓN DEL UNIVERSO ---
        let scene, camera, renderer;
        let fractalesActivos = [];
        let generacionGlobal = 0;
        
        // Movimiento más lento, flotante y majestuoso
        let velocidadBase = 0.35;
        let velocidadObjetivo = 0.35;
        let VELOCIDAD_VIAJE = 0.35; 
        
        const DISTANCIA_VISION = 450; 
        const DISTANCIA_MUERTE = 60;  
        const INTERVALO_SPAWN = 35;   
        let proximoSpawnZ = 0;        

        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let isPressing = false;

        let isStereo = false;
        let stereoCamera = new THREE.StereoCamera();
        let eyeSep = 0.064;

        // --- 2. MOTOR DE AUDIO ESPACIAL 3D (Música de las Esferas) ---
        let audioCtx = null;
        let masterReverb;
        let audioIniciado = false;

        function iniciarAudio() {
            if (audioIniciado) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Reverb/Eco Inmenso
            masterReverb = audioCtx.createDelay();
            masterReverb.delayTime.value = 0.7; // Eco profundo
            const feedback = audioCtx.createGain();
            feedback.gain.value = 0.6; // Alta retroalimentación para espacialidad
            
            const lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 800; // Sonido muy cálido y apagado en el fondo
            
            masterReverb.connect(lowpass);
            lowpass.connect(feedback);
            feedback.connect(masterReverb);
            
            masterReverb.connect(audioCtx.destination);

            audioIniciado = true;
        }

        function emitirCantoFractal(fractal, materialIndex, generacion) {
            if (!audioCtx) return;
            
            // Crear el Panner 3D (Audio 8D)
            const panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF'; // Alta calidad de audio posicional 3D
            panner.distanceModel = 'exponential';
            panner.refDistance = 15; // Distancia a la que empieza a atenuarse
            panner.maxDistance = 150;
            panner.rolloffFactor = 1.2;
            
            // Asignar la posición del fractal en el espacio al nodo de audio
            panner.positionX.value = fractal.position.x;
            panner.positionY.value = fractal.position.y;
            panner.positionZ.value = fractal.position.z;

            // Escala Cósmica: C Maj9 #11 (Sensación de inmensidad)
            const frecuenciasBase = [130.81, 196.00, 261.63, 329.63, 370.00, 392.00, 493.88, 523.25]; // C3, G3, C4, E4, F#4, G4, B4, C5
            const freqCentral = frecuenciasBase[(generacion + materialIndex) % frecuenciasBase.length];
            
            // Sintetizador de Pad Armónico (2 osciladores)
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'sine'; // Ondas puras
            osc2.type = 'sine';
            
            // Oscilador 2 ligeramente desafinado para crear un efecto de "Coro" o vastedad
            osc1.frequency.value = freqCentral;
            osc2.frequency.value = freqCentral * 1.005; 

            // Envolvente de volumen muy lenta (Música Ambient)
            const ahora = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, ahora);
            gainNode.gain.linearRampToValueAtTime(0.08, ahora + 2.5); // Ataque de 2.5 segundos (aparece suavemente)
            gainNode.gain.exponentialRampToValueAtTime(0.0001, ahora + 8.0); // Cae durante 8 segundos

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            
            // Enrutamiento Espacial: Nodos -> Panner 3D -> Salida/Reverb
            gainNode.connect(panner);
            panner.connect(audioCtx.destination);
            panner.connect(masterReverb);

            osc1.start(ahora);
            osc2.start(ahora);
            osc1.stop(ahora + 8.0);
            osc2.stop(ahora + 8.0);
        }

        // --- 3. INICIALIZACIÓN 3D ---
        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010103, 0.009);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 800);
            camera.position.set(0, 0, 0); 

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.AdditiveToneMapping;
            document.body.appendChild(renderer.domElement);

            const luzAmbiental = new THREE.AmbientLight(0x111122);
            scene.add(luzAmbiental);
            
            const luzFrontal = new THREE.PointLight(0xffffff, 2.0, 150);
            luzFrontal.position.set(0, 0, 0);
            scene.add(luzFrontal);

            // Eventos PC
            document.addEventListener('keydown', onDocumentKeyDown, false);
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('mousedown', onPressDown, false);
            document.addEventListener('mouseup', onPressUp, false);

            // Eventos Móviles
            document.addEventListener('touchstart', onTouchStart, {passive: false});
            document.addEventListener('touchmove', onTouchMove, {passive: false});
            document.addEventListener('touchend', onPressUp, false);

            window.addEventListener('resize', onWindowResize, false);
            
            // Ocultar HUD después de 4 segundos
            setTimeout(() => {
                document.getElementById('ui-layer').style.opacity = '0';
            }, 4000);
        }

        // --- 4. CONTROLES E INTERACCIÓN ---
        function onPressDown() {
            iniciarAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            velocidadObjetivo = 0.05; // Densidad espacial extrema al frenar
        }

        function onPressUp() {
            velocidadObjetivo = velocidadBase; // Recuperar inercia suave
        }

        function onMouseMove(event) {
            mouseX = (event.clientX - window.innerWidth / 2);
            mouseY = (event.clientY - window.innerHeight / 2);
        }

        function onTouchStart(event) {
            onPressDown();
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - window.innerWidth / 2) * 1.5;
                mouseY = (event.touches[0].clientY - window.innerHeight / 2) * 1.5;
            }
        }

        function onTouchMove(event) {
            event.preventDefault(); // Previene scroll en móvil
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - window.innerWidth / 2) * 1.5;
                mouseY = (event.touches[0].clientY - window.innerHeight / 2) * 1.5;
            }
        }

        function onDocumentKeyDown(event) {
            if (event.key === '3') {
                isStereo = !isStereo;
                // Optimización: Bajar resolución en modo 3D para mantener fluidez
                renderer.setPixelRatio(isStereo ? 1 : window.devicePixelRatio);
            } else if (event.key === '9') {
                eyeSep = Math.max(0.005, eyeSep - 0.005);
            } else if (event.key === '0') {
                eyeSep += 0.005;
            }
        }

        // --- 5. GENERACIÓN PROCEDURAL ---
        function spawnFractal(zPos) {
            generacionGlobal++;
            const faseEvolutiva = generacionGlobal * 0.05; 
            const anguloAureo = Math.PI * (3 - Math.sqrt(5));
            const anguloEvolutivo = anguloAureo + (Math.cos(faseEvolutiva * 0.5) * 0.5);

            const numElementos = Math.floor(200 + Math.sin(faseEvolutiva * 1.5) * 200);

            // Paleta de materiales dinámicos
            const baseHue = (generacionGlobal * 0.015) % 1.0;
            const wireframeProb = Math.random() > 0.85; 
            const fractalMaterials = [];
            
            for(let m = 0; m < 5; m++) {
                const offsetHue = (baseHue + (Math.random() * 0.15 - 0.075) + 1.0) % 1.0;
                const lum = 0.4 + (Math.random() * 0.2); 
                
                fractalMaterials.push(new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(offsetHue, 0.9, lum),
                    emissive: new THREE.Color().setHSL(offsetHue, 1.0, lum * 0.4),
                    emissiveIntensity: 1.0, // Control de brillo para la colisión
                    transparent: true,
                    opacity: wireframeProb ? 0.35 : (0.7 + Math.random() * 0.3),
                    roughness: 0.1,
                    metalness: 0.9,
                    wireframe: wireframeProb
                }));
            }
            
            const radioTotal = 15 + Math.sin(faseEvolutiva) * 10;
            const grupo = new THREE.Group();
            
            const dispersion = 60 + Math.sin(faseEvolutiva * 0.8) * 40;
            const posX = (Math.random() - 0.5) * dispersion;
            const posY = (Math.random() - 0.5) * dispersion;
            grupo.position.set(posX, posY, zPos);

            let geoBase;
            const tipoGeometria = Math.floor(Math.abs(Math.sin(faseEvolutiva * 0.7) * 5)); 
            
            if(tipoGeometria === 0) geoBase = new THREE.OctahedronGeometry(0.5, 0);
            else if(tipoGeometria === 1) geoBase = new THREE.TetrahedronGeometry(0.5, 0);
            else if(tipoGeometria === 2) geoBase = new THREE.IcosahedronGeometry(0.4, 0);
            else if(tipoGeometria === 3) geoBase = new THREE.CylinderGeometry(0.0, 0.4, 1.5, 4);
            else geoBase = new THREE.DodecahedronGeometry(0.4, 0);

            geoBase.scale(
                0.2 + Math.abs(Math.sin(generacionGlobal * 1.3))*0.8, 
                1.0 + Math.abs(Math.cos(generacionGlobal))*2.5, 
                0.2 + Math.abs(Math.sin(generacionGlobal * 1.3))*0.8
            );

            const tipoArquitectura = Math.floor((generacionGlobal / 10) % 5);

            for (let i = 0; i < numElementos; i++) {
                let x, y, z;
                const ratio = i / (numElementos - 1);
                const theta = anguloEvolutivo * i;
                let sizeMod = 1.0;

                if (tipoArquitectura === 0) {
                    y = 1 - ratio * 2; 
                    const radioAtY = Math.sqrt(1 - y * y); 
                    x = Math.cos(theta) * radioAtY;
                    z = Math.sin(theta) * radioAtY;
                } else if (tipoArquitectura === 1) {
                    y = (ratio * 2) - 1; 
                    const expansion = ratio * 1.5 + 0.1;
                    x = Math.cos(theta) * expansion;
                    z = Math.sin(theta) * expansion;
                    sizeMod = 1.5 - ratio;
                } else if (tipoArquitectura === 2) {
                    y = (Math.random() - 0.5) * 2;
                    const radioDisp = Math.random() + 0.3;
                    x = Math.cos(theta) * radioDisp;
                    z = Math.sin(theta) * radioDisp;
                    sizeMod = Math.random() > 0.9 ? (Math.random() * 4 + 2) : (Math.random() * 0.8 + 0.2);
                } else if (tipoArquitectura === 3) {
                    const phi = Math.acos(1 - 2 * ratio);
                    x = Math.sin(phi) * Math.cos(theta);
                    y = Math.sin(phi) * Math.sin(theta);
                    z = Math.cos(phi);
                    sizeMod = Math.random() * 2.5 + 0.1;
                } else {
                    y = (ratio * 2) - 1; 
                    const brazo = i % 2 === 0 ? 0 : Math.PI;
                    const giro = theta * 0.4;
                    x = Math.cos(giro + brazo);
                    z = Math.sin(giro + brazo);
                    sizeMod = Math.random() * 1.2 + 0.5;
                }

                const materialElegido = fractalMaterials[Math.floor(Math.random() * fractalMaterials.length)];
                const mesh = new THREE.Mesh(geoBase, materialElegido);
                
                mesh.position.set(x * radioTotal, y * radioTotal, z * radioTotal);
                
                if(tipoArquitectura === 0 || tipoArquitectura === 3) mesh.lookAt(0,0,0);
                else mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                
                const baseScale = (1 - ratio) * 1.5 + 0.5;
                mesh.scale.multiplyScalar(baseScale * sizeMod);
                
                grupo.add(mesh);
            }

            grupo.userData = {
                idGen: generacionGlobal,
                rotacionX: (Math.random() - 0.5) * 0.015,
                rotacionY: (Math.random() - 0.5) * 0.025,
                rotacionZ: (Math.random() - 0.5) * 0.015,
                pulsoVelocidad: 0.5 + Math.random() * 2,
                pulsoFase: Math.random() * Math.PI * 2,
                materialesLocales: fractalMaterials,
                haCantado: false // Control para evitar la saturación de sonido
            };

            scene.add(grupo);
            fractalesActivos.push(grupo);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 6. BUCLE PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);
            const tiempo = Date.now() * 0.001;

            // Inercia suave para la velocidad/densidad
            VELOCIDAD_VIAJE += (velocidadObjetivo - VELOCIDAD_VIAJE) * 0.02; // Transición más suave
            camera.position.z -= VELOCIDAD_VIAJE;

            targetX = mouseX * 0.07;
            targetY = mouseY * 0.07;
            camera.position.x += (targetX - camera.position.x) * 0.03;
            camera.position.y += (-targetY - camera.position.y) * 0.03;
            
            camera.lookAt(camera.position.x, camera.position.y, camera.position.z - 150);

            scene.children.forEach(child => {
                if(child.isPointLight) {
                    child.position.z = camera.position.z;
                    child.position.x = camera.position.x;
                    child.position.y = camera.position.y;
                }
            });

            // Actualizar la posición del Oyente 3D en el motor de Audio
            if (audioCtx && audioCtx.listener) {
                const listener = audioCtx.listener;
                if (listener.positionX) {
                    listener.positionX.value = camera.position.x;
                    listener.positionY.value = camera.position.y;
                    listener.positionZ.value = camera.position.z;
                } else if (listener.setPosition) { // Fallback para navegadores antiguos
                    listener.setPosition(camera.position.x, camera.position.y, camera.position.z);
                }
            }

            while (proximoSpawnZ > camera.position.z - DISTANCIA_VISION) {
                spawnFractal(proximoSpawnZ);
                proximoSpawnZ -= INTERVALO_SPAWN; 
            }

            let minZDist = Infinity;
            let grupoColision = null;

            for (let i = fractalesActivos.length - 1; i >= 0; i--) {
                const fractal = fractalesActivos[i];
                
                // Animación intrínseca
                fractal.rotation.x += fractal.userData.rotacionX * (VELOCIDAD_VIAJE * 1.5);
                fractal.rotation.y += fractal.userData.rotacionY * (VELOCIDAD_VIAJE * 1.5);
                fractal.rotation.z += fractal.userData.rotacionZ * (VELOCIDAD_VIAJE * 1.5);
                
                const escalaPulso = 1 + Math.sin(tiempo * fractal.userData.pulsoVelocidad + fractal.userData.pulsoFase) * 0.06;
                fractal.scale.set(escalaPulso, escalaPulso, escalaPulso);

                // Recuperación de la luz tras chocar (Fade out elegante)
                fractal.userData.materialesLocales.forEach(mat => {
                    if (mat.emissiveIntensity > 1.0) {
                        mat.emissiveIntensity += (1.0 - mat.emissiveIntensity) * 0.02; // Se apaga más lento
                    }
                });

                let distCamara = Math.abs(fractal.position.z - camera.position.z);

                // --- SISTEMA DE COLISIÓN SINESTÉSICA / MÚSICA DE LAS ESFERAS ---
                // Si estamos entrando en la órbita cercana de un fractal (120 unidades)
                if (distCamara < 120 && !fractal.userData.haCantado) {
                    // Probabilidad controlada para evitar estridencia
                    if (Math.random() < 0.08) {
                        fractal.userData.haCantado = true; // Solo canta una vez al pasarlo
                        
                        let matIndex = Math.floor(Math.random() * 5);
                        let matElegido = fractal.userData.materialesLocales[matIndex];
                        
                        // Explosión visual suave
                        matElegido.emissiveIntensity = 3.5; 
                        
                        // Generar el sonido posicionado exactamente en la coordenada del fractal
                        emitirCantoFractal(fractal, matIndex, fractal.userData.idGen);
                    }
                }

                // Destrucción / Memoria
                if (fractal.position.z > camera.position.z + DISTANCIA_MUERTE) {
                    scene.remove(fractal);
                    fractal.traverse((child) => {
                        if (child.isMesh) child.geometry.dispose();
                    });
                    if(fractal.userData.materialesLocales) {
                        fractal.userData.materialesLocales.forEach(mat => mat.dispose());
                    }
                    fractalesActivos.splice(i, 1);
                }
            }

            // --- RENDERIZADO ESTÉREO O NORMAL ---
            if (isStereo) {
                stereoCamera.eyeSep = eyeSep;
                stereoCamera.update(camera);
                
                const size = new THREE.Vector2();
                renderer.getSize(size);
                
                renderer.setScissorTest(true);

                // Ojo Izquierdo
                renderer.setScissor(0, 0, size.width / 2, size.height);
                renderer.setViewport(0, 0, size.width / 2, size.height);
                renderer.render(scene, stereoCamera.cameraL);

                // Ojo Derecho
                renderer.setScissor(size.width / 2, 0, size.width / 2, size.height);
                renderer.setViewport(size.width / 2, 0, size.width / 2, size.height);
                renderer.render(scene, stereoCamera.cameraR);

                renderer.setScissorTest(false);
            } else {
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
